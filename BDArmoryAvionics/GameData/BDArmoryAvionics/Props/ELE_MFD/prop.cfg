// ELE multi-function display (IVA). Bottom keys pick the page, right keys act on it.
PROP
{
	name = ELE_MFD
	proxy = 0, 0, 0, 0.26, 0.02, 0.23, 0, 1, 0
	MODEL
	{
		model = BDArmoryAvionics/Props/ELE_MFD/model
	}
	MODULE
	{
		name = InternalELEMfd
		resolution = 512
		refreshHz = 12
		modelRotation = 0,180,0
	}
}

