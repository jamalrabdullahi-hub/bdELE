// ELE: a Waterfall plume for every jet and liquid-fuel engine that has none yet (mod engines, ELE's own Dynamic jets),
// using Stock Waterfall Effects templates, sized by thrust. Runs last, so real per-engine configs always win.
// Solid boosters keep their stock flame (ELE's engine smoke adds the trail).

// 1) make sure the engine names its thrust transform (the plume hangs from it)
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[~thrustVectorTransformName[]],!MODULE[ModuleWaterfallFX]]:NEEDS[Waterfall,StockWaterfallEffects]:FINAL
{
	@MODULE[ModuleEngines*],0
	{
		thrustVectorTransformName = thrustTransform
	}
}

// 2) jets: turbofan plume
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[IntakeAir]],!MODULE[ModuleWaterfallFX]]:NEEDS[Waterfall,StockWaterfallEffects]:FINAL
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = eleFallbackFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.03
			responseRateDown = 0.03
		}
		CONTROLLER
		{
			name = mach
			linkedTo = mach
		}
		TEMPLATE
		{
			templateName = stock-kerozine-turbofan-1
			overrideParentTransform = #$/MODULE[ModuleEngines*]/thrustVectorTransformName$
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.5,0.5,0.5
		}
	}
	%eleFallbackPlume = jet
}

// 3) liquid fuel + oxidiser rockets: kerolox sustainer plume
@PART[*]:HAS[@MODULE[ModuleEngines*]:HAS[@PROPELLANT[Oxidizer]],!MODULE[ModuleWaterfallFX]]:NEEDS[Waterfall,StockWaterfallEffects]:FINAL
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = eleFallbackFX
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			responseRateUp = 0.1
			responseRateDown = 0.1
		}
		TEMPLATE
		{
			templateName = stock-kerolox-sustainer
			overrideParentTransform = #$/MODULE[ModuleEngines*]/thrustVectorTransformName$
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.6,0.6,0.6
		}
	}
	%eleFallbackPlume = rocket
}

// 4) size by thrust (templates are made for ~1.25 m engines)
@PART[*]:HAS[#eleFallbackPlume[*],@MODULE[ModuleEngines*]:HAS[#maxThrust[<30]]]:NEEDS[Waterfall]:FINAL
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[eleFallbackFX]] { @TEMPLATE { @scale = 0.3,0.3,0.3 } }
}
@PART[*]:HAS[#eleFallbackPlume[*],@MODULE[ModuleEngines*]:HAS[#maxThrust[>150]]]:NEEDS[Waterfall]:FINAL
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[eleFallbackFX]] { @TEMPLATE { @scale = 0.9,0.9,0.9 } }
}
@PART[*]:HAS[#eleFallbackPlume[*],@MODULE[ModuleEngines*]:HAS[#maxThrust[>600]]]:NEEDS[Waterfall]:FINAL
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[eleFallbackFX]] { @TEMPLATE { @scale = 1.4,1.4,1.4 } }
}
@PART[*]:HAS[#eleFallbackPlume[*],@MODULE[ModuleEngines*]:HAS[#maxThrust[>1500]]]:NEEDS[Waterfall]:FINAL
{
	@MODULE[ModuleWaterfallFX]:HAS[#moduleID[eleFallbackFX]] { @TEMPLATE { @scale = 2,2,2 } }
}
