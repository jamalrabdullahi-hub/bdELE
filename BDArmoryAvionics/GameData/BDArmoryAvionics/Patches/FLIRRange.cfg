// ELE: targeting pods (FLIR ball, TGP, and any part with a BDArmory targeting camera) see out to 1500 km
// and zoom to 254x (40 deg -> 0.157 deg). Long range lock over land comes from the ELE plugin (terrain ray march).
@PART[*]:HAS[@MODULE[ModuleTargetingCamera]]:FOR[BDArmoryAvionics]
{
	@MODULE[ModuleTargetingCamera]
	{
		%maxRayDistance = 1500000
		%zoomFOVs = 40,15.6,7.96,4,2,1,0.5,0.3,0.1575
	}
}
