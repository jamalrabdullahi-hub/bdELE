// ELE gunship cockpit + FreeIva: unbuckle, float between the seats, climb out through the canopy hatch (EVA).
@PART[ELE_HeliCockpit]:NEEDS[FreeIva]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleFreeIva
	}
}

@INTERNAL[ELE_TandemIVA]:NEEDS[FreeIva]:FOR[BDArmoryAvionics]
{
	@MODULE[InternalLoftShell]
	{
		// invisible walls: the tub plus the canopy space above it
		LOFT
		{
			name = shellCollider
			role = accent
			axis = Z
			segments = 20
			collider = true
			convex = false
			hidden = true
			inside = true
			SECTION
			{
				pos = 0,0.25,-0.33
				w = 1.0
				h = 1.6
				n = 3
			}
			SECTION
			{
				pos = 0,0.2,-1.9
				w = 1.0
				h = 1.55
				n = 3
			}
			SECTION
			{
				pos = 0,0.05,-2.9
				w = 0.86
				h = 1.2
				n = 3
			}
			SECTION
			{
				pos = 0,0,-3.42
				w = 0.64
				h = 0.8
				n = 2.6
			}
		}
	}
	MODULE
	{
		name = InternalModuleFreeIva
		shellColliderName = loft_shellCollider
	}
	// canopy hatch on the pilot's right: links to the cockpit's EVA airlock
	PROP
	{
		name = Hatch_Plane
		position = -0.47,0.55,-1.35
		rotation = 0,0,-0.7071068,0.7071068
		scale = 0.8,0.8,0.8
		MODULE
		{
			name = HatchConfig
			airlockName = airlock
		}
	}
}
