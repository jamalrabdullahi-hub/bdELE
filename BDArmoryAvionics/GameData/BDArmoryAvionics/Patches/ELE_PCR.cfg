// ELE: Probe Control Room uses the ELE drone operations room (one seated operator) instead of its mission control.
@PROBECONTROLROOM_CONFIG:NEEDS[ProbeControlRoom]:BEFORE[ProbeControlRoom]
{
	@INTERNAL
	{
		@name = ELE_DroneOps
	}
}

// With RasterPropMonitor, the desk screens become ASET ALCOR MFDs running the ELE pages.
@INTERNAL[ELE_DroneOps]:NEEDS[RasterPropMonitor,ASET/ASET_Props,ProbeControlRoom]:AFTER[BDArmoryAvionics]
{
	@PROP[ELE_MFD],*
	{
		@name = ELE_ALCOR_MFD
		@rotation = -0.2164396,0,0,0.976296
		@scale = 1,1,1
	}
}
