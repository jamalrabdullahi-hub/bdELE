// ELE: put the multi-function display into cockpits, in place of the first status-light panel
// (or the docking monitor where a cockpit has one). Same position, rotation and scale as the prop it replaces.
@INTERNAL[*]:HAS[@PROP[MonitorDockingMode]]:FOR[BDArmoryAvionics]
{
	@PROP[MonitorDockingMode]
	{
		@name = ELE_MFD
	}
}
@INTERNAL[*]:HAS[@PROP[IndicatorPanel],!PROP[ELE_MFD]]:FOR[BDArmoryAvionics]
{
	@PROP[IndicatorPanel]
	{
		@name = ELE_MFD
	}
}
