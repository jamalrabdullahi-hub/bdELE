// ELE suite on the ASET ALCOR 40x20 MFD (needs RasterPropMonitor + the ASET ALCOR model).
// Top/bottom keys: R1 CAM  R2 WPN  R3 ENG  R4 RDR  R5 SYS  R6 C2  R7 AP  R8 STEALTH  STBY home.
// Arrows/ENTER/ESC/HOME and R9/R10 work the current page (see each page's key line).
PROP:NEEDS[RasterPropMonitor,ASET/ASET_Props]
{
	name = ELE_ALCOR_MFD
	MODEL
	{
		model = ASET/ASET_Props/MFDs/ALCORMFD40x20/ALCORMFD40X20
	}
	MODULE
	{
		name = RasterPropMonitor
		screenTransform = FlatMon40x10Screen
		fontTransform = ASET/ASET_Props/MFDs/Fonts/mainfont
		textureLayerID = _Emissive
		screenWidth = 40
		screenHeight = 20
		screenPixelWidth = 640
		screenPixelHeight = 640
		fontLetterWidth = 16
		fontLetterHeight = 32
		cameraAspect = 1.0
		fontDefinition = ASET/ASET_Props/MFDs/Fonts/fontDefinition.txt
		extraFont = ASET/ASET_Props/MFDs/Fonts/extraFont1
		extraFont = ASET/ASET_Props/MFDs/Fonts/InvertedMainFont
		extraFont = ASET/ASET_Props/MFDs/Fonts/InvertedExtraFont
		extraFont = ASET/ASET_Props/MFDs/Fonts/Symbols01
		refreshDrawRate = 2
		refreshTextRate = 4
		refreshDataRate = 4
		emptyColor = 0,0,0,255
		buttonClickSound = Squad/Sounds/sound_click_tick
		buttonClickVolume = 0.6
		globalButtons = button_UP,button_DOWN,button_ENTER,button_ESC,button_HOME,button_RIGHT,button_LEFT,buttonR9,buttonR10
		noSignalTextureURL = ASET/ASET_Props/MFDs/ScreenPlates/nosignal
		PAGE
		{
			name = eleCAM
			button = buttonR1
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = CAM
			}
			BACKGROUNDHANDLER
			{
				name = ELERPMPages
				method = RenderBackground
				page = CAM
			}
		}
		PAGE
		{
			name = eleWPN
			button = buttonR2
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = WPN
			}
		}
		PAGE
		{
			name = eleENG
			button = buttonR3
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = ENG
			}
		}
		PAGE
		{
			name = eleRDR
			button = buttonR4
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = RDR
			}
			BACKGROUNDHANDLER
			{
				name = ELERPMPages
				method = RenderBackground
				page = RDR
			}
		}
		PAGE
		{
			name = eleSYS
			button = buttonR5
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = SYS
			}
		}
		PAGE
		{
			name = eleC2
			button = buttonR6
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = C2
			}
		}
		PAGE
		{
			name = eleAP
			button = buttonR7
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = AP
			}
		}
		PAGE
		{
			name = eleSTL
			button = buttonR8
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = STL
			}
		}
		PAGE
		{
			name = eleHOME
			button = button_STBY
			default = yes
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = HOME
			}
		}
	}
}

// In the ELE tandem gunship cockpit, use the ASET MFDs instead of the lightweight ELE screens when RPM is installed.
@INTERNAL[ELE_TandemIVA]:NEEDS[RasterPropMonitor,ASET/ASET_Props]:AFTER[BDArmoryAvionics]
{
	@PROP[ELE_MFD],*
	{
		@name = ELE_ALCOR_MFD
		@rotation = -0.1305262,0,0,0.9914449
		@scale = 0.85,0.85,0.85
	}
}
