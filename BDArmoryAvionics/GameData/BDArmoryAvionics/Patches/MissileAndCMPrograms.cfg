// BDArmory Avionics & C4ISR
// Countermeasure programs on every BDArmory weapon manager, and flight profiles (per-stage guidance, ICBM)
// on every modular missile guidance part. Both are set up in the VAB/SPH part menu.

@PART[*]:HAS[@MODULE[MissileFire],!MODULE[ModuleCMProgram]]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleCMProgram
	}
}

@PART[*]:HAS[@MODULE[BDModularGuidance],!MODULE[ModuleMissileProfile]]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleMissileProfile
	}
}
