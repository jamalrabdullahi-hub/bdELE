// ELE pages on every RasterPropMonitor screen already in the game (B9, RPM basic MFD, NMB F-18 / MFD3, ...):
// the pages for systems ELE replaces are swapped in place, keeping each screen's own buttons:
//   Vessel Viewer -> ELE radar   resources -> ELE weapons   ship info -> ELE systems   engine ignitor -> ELE engines
//   flight log -> ELE live stealth   MechJeb SmartASS -> ELE autopilot   DPAI / SCANsat -> ELE C2   external cameras -> ELE cameras (HullCam / EO-IR)
// Screens keep their other pages (navball, PFD, orbit, target, graphs, crew, log). Delete this file to undo.
@PROP[*]:HAS[@MODULE[RasterPropMonitor]]:NEEDS[RasterPropMonitor]:FINAL
{
	@MODULE[RasterPropMonitor],*
	{
		@PAGE:HAS[#name[pluginVesselView]],*
		{
			!PAGEHANDLER,* {}
			!BACKGROUNDHANDLER,* {}
			!text = delete
			!textureURL = delete
			!textureInterlayURL = delete
			!cameraTransform = delete
			PAGEHANDLER
			{
				name = ELERPMPages
				method = ShowPage
				pageActiveMethod = PageActive
				buttonClickMethod = ButtonProcessor
				page = RDR
			}
			BACKGROUNDHANDLER
			{
				name = ELERPMPages
				method = RenderBackground
