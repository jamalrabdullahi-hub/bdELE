// BD Armory: Enhanced Lethality Edition - modular missile enhancements.

// Procedural missile motor: x2 thrust and x2 propellant (applied at launch; the Missile Lab counts it in the VAB/SPH).
// Change the multipliers here if you want a different balance.
@PART[proceduralMissileSRB]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleMissileMotorBoost
		thrustMult = 2
		fuelMult = 2
	}
}

// Fragmentation warhead: the procedural high explosive's blast, plus 100 fragments out to 2x the blast radius
// (BDArmory kinetic damage + bullet-hole effects, capped at 100 holes).
+PART[proceduralHighExplosive]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	@name = proceduralFragWarhead
	@title = Procedural Fragmentation Warhead
	@description = High explosive with a fragmentation case: full blast, plus shrapnel out to twice the blast radius. Best against aircraft, missiles, light vehicles and SAM sites.
	@cost = 250
	%tags = bda bdarmory missile modular procedural warhead fragmentation shrapnel frag
	MODULE
	{
		name = ModuleFragmentationWarhead
		fragments = 100
		rangeMult = 2
		fragMass = 0.03
		caliber = 12
		fragSpeed = 1800
	}
}

// Terminal attack modes on every modular missile guidance part.
@PART[*]:HAS[@MODULE[BDModularGuidance],!MODULE[ModuleMissileTerminal]]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleMissileTerminal
	}
}
