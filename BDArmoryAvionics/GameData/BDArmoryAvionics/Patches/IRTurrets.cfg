// BDArmory Avionics & C4ISR
// Turret control for Infernal Robotics Next servos: no setup. Servos between the craft and a gun, launcher,
// targeting camera or HullCam aim it automatically (part menu -> BDA turret -> BDA aiming to opt a servo out).

@PART[*]:HAS[@MODULE[ModuleIRServo_v3],!MODULE[ModuleIRTurret]]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleIRTurret
	}
}
