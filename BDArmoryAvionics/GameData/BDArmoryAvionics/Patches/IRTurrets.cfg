// BDArmory Avionics & C4ISR
// Turret control for Infernal Robotics Next servos: put a turret's servos in the same turret group
// (part menu -> BDA turret control) and mount a gun, launcher or camera at the tip.

@PART[*]:HAS[@MODULE[ModuleIRServo_v3],!MODULE[ModuleIRTurret]]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleIRTurret
	}
}
