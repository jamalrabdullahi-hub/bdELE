// BDArmory Avionics & C4ISR
// Adds the C4ISR data link terminal to every command part (cockpits, pods, probe cores)
// and every part carrying a BDArmory weapon manager, so any combat craft can be set up in the VAB/SPH.

@PART[*]:HAS[@MODULE[ModuleCommand],!MODULE[ModuleC4ISRTerminal]]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleC4ISRTerminal
	}
}

@PART[*]:HAS[@MODULE[MissileFire],!MODULE[ModuleC4ISRTerminal]]:NEEDS[BDArmory]:FOR[BDArmoryAvionics]
{
	MODULE
	{
		name = ModuleC4ISRTerminal
	}
}
