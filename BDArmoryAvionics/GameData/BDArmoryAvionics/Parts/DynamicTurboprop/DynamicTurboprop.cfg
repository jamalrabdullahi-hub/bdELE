	manufacturer = Enhanced Lethality Edition
	description = A turboprop you design: core size, compressor stages and tech set the shaft power; prop diameter and blade count set the thrust. Very efficient, strong at low speed, runs out of puff around Mach 0.6. Reverse pitch for short landings, braking and backing up drones (action groups). Needs an air intake.
	tags = turboprop propeller prop engine drone reverse procedural ele
	mass = 0.5
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 2000
