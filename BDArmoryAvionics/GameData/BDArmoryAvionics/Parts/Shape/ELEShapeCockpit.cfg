// ELE Shape cockpit: a crewed ELE Shape. Its IVA is built from the shape you make (walls, canopy view, floor, panels, seats where you put them).
PART
{
	name = ELE_ShapeCockpit
	module = Part
	author = ELE
	MODEL
	{
		model = BDArmoryAvionics/Parts/DynamicFrame/model
	}
	rescaleFactor = 1
	node_stack_top = 0.0, 1.25, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -1.25, 0.0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, 0.625, 0.0, 0.0, 1.0
	attachRules = 1,1,1,1,0
	TechRequired = start
	entryCost = 0
	cost = 100
	category = Structural
	subcategory = 0
	title = ELE Shape Cockpit
	manufacturer = Enhanced Lethality Edition
	description = A cockpit you shape yourself, for one or two crew (tandem or side by side). Its interior is built from your shape, with the glass canopy band you set. Otherwise like ELE Shape: a fuselage, pod, nose, fairing or canopy you shape yourself. Right-click > Edit shape: drag points and sections with handles, mirror left and right, add sharp creases, use presets. Stock panelled look, optional fuel tank from its volume.
	tags = cockpit crew command iva shape fuselage procedural loft nose cone fairing canopy flyout vertex ele
	mass = 0.3
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 30
	breakingForce = 2000
	breakingTorque = 2000
	maxTemp = 2000
	fuelCrossFeed = True
	CrewCapacity = 2
	vesselType = Plane
	INTERNAL
	{
		name = ELE_ShapeIVA
	}
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.02
		}
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 50
		maxAmount = 50
	}
	MODULE
	{
		name = ModuleELEShape
		meshName = frameMesh
		skinDensity = 0.008
		canopy = True
		canopyFrom = 0
		canopyTo = 1.25
		canopyAbove = 0.1
		seatAlong = 0.45
		seatUp = -0.3
		seatSpacing = 0
	}
}
