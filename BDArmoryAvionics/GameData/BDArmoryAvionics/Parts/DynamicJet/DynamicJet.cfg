// ELE Dynamic Jet: design the engine in the editor (diameter, bypass, blades, stages, tech, nozzle, afterburner).
// The engine numbers below are placeholders: ModuleDynamicJet rewrites both engine modules from the design.
PART
{
	name = ELE_DynamicJet
	module = Part
	author = ELE
	MODEL
